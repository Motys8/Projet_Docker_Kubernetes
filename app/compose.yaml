services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-inidb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U taskboard -d taskboard"]
      interval: 5s
  web: 
    build: ./app
    image: taskboard-web:1.0.0
    env_file: .env
    environment: { DB_HOST: db, DB_PORT: "5432" }
    ports: ["3000:3000"] 
    depends_on:
      db: { condition: service_healthy }

volumes:
  db-data: