apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: taskboard
  labels:
    app: taskboard
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskboard
      tier: web
  template:
    metadata:
      labels:
        app: taskboard
        tier: web
    spec:
      containers:
        - name: web
          image: taskboard-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: web-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
