apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: taskboard
  labels:
    app: taskboard
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskboard
      tier: web
  template:
    metadata:
      labels:
        app: taskboard
        tier: web
    spec:
      containers:
        - name: web
          image: taskboard-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: "db"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "taskboard"
            - name: DB_USER
              value: "taskboard"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
